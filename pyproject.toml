[project]
name = "ai-vietnamese-dubbing"
version = "0.4.0"
description = "Local AI Vietnamese dubbing extension and CPU TTS server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "numpy",
    "onnxruntime==1.24.3",
    "huggingface-hub",
    "vieneu==3.8.3",
    "vig2p>=0.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
]

[tool.uv]
package = false
